[project]
name = "slack-conductor"
version = "0.1.0"
description = "Personal Slack bridge to the local Conductor Mac app"
requires-python = ">=3.12"
dependencies = [
  "slack-bolt>=1.23,<2",
  "python-dotenv>=1.1,<2",
  "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
  "markdown-it-py>=4,<5",
]

[project.scripts]
sc = "slack_conductor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
