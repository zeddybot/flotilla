name: ci
on: [push, pull_request]
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/test_db.py tests/test_bridge.py tests/test_service.py tests/test_lifecycle.py tests/test_presentation.py tests/test_connection_health.py tests/test_markdown.py -q
      - run: uv run pytest tests/test_native_journal.py tests/test_native_process.py tests/test_native_frontend.py tests/test_native_adapter.py tests/test_native_recovery.py -q
      - run: uv run pytest tests/test_file_links.py -q
      - run: uv run pytest tests/test_uploads.py -q
      - run: uv run pytest tests/test_file_delivery.py -q
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
