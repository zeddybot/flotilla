name: ci
on: [push, pull_request]
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/test_db.py tests/test_bridge.py tests/test_service.py tests/test_lifecycle.py tests/test_presentation.py -q
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
