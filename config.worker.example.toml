# A headless worker connects to one dedicated single-owner control server.
mode = "client"
runtime_adapter = "headless"
client_id = "daytona-worker"
server_url = "wss://your-private-control-server/client"
remote_token_file = "/data/config/client.token"
repo = "/data/repos/project"
workspace_root = "/data/workspaces"
state_dir = "/data/state"
engine = "codex"
claude_binary = "/usr/local/bin/claude"
codex_binary = "/usr/local/bin/codex"
engine_model = ""
engine_effort = ""
# Daytona is the execution boundary; Codex runs without an inner sandbox.
engine_permission_policy = "external-sandbox"
send_mode = "queue"
